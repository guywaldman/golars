name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... -count=1
      - run: go vet ./...

  cross-compile:
    name: Go build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile packages and test binaries
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p build
          go build ./...
          go test -c ./internal/core -o build/core.test
          go test -c ./internal/native -o build/native.test

  memory-safety:
    name: Memory safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Race detector
        run: go test -race ./... -count=1
      - name: Pointer checking
        env:
          GODEBUG: checkptr=2
        run: go test -gcflags=all=-d=checkptr=2 ./... -count=1
      - name: Allocation and native-handle regressions
        run: go test ./internal/core -run 'Test(ClosedFrames|QuotaAllocator|NativeFrame)' -count=1 -v

  e2e:
    name: Emulator E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run emulator-backed tests
        run: go test -tags=e2e ./... -count=1 -v

  rust-native:
    name: Rust backend (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            mode: native
          - name: linux-arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            mode: cross
          - name: darwin-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            mode: native
          - name: windows-amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            mode: native
          - name: windows-arm64-check
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            mode: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: true
      - name: Install cross
        if: matrix.mode == 'cross'
        shell: bash
        run: cargo install cross --locked
      - name: Build backend
        if: matrix.mode == 'native'
        run: cargo build --manifest-path internal/native/rust/Cargo.toml --release --target ${{ matrix.target }}
      - name: Build Linux ARM backend
        if: matrix.mode == 'cross'
        run: cross build --manifest-path internal/native/rust/Cargo.toml --release --target ${{ matrix.target }}
      - name: Check Windows ARM backend
        if: matrix.mode == 'check'
        run: cargo check --manifest-path internal/native/rust/Cargo.toml --target ${{ matrix.target }}

  benchmark-regression:
    name: Native benchmark regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - name: Build benchmark input and runners
        run: |
          go run ./cmd/golars-benchmark-data \
            -output /tmp/golars-benchmark.parquet \
            -rows 1000000 \
            -row-group-size 65536
          go build -o /tmp/golars-benchmark ./cmd/golars-benchmark
          cargo build --manifest-path benchmarks/polars/Cargo.toml --release
      - name: Compare native Go with Rust Polars
        env:
          GOMAXPROCS: 2
          POLARS_MAX_THREADS: 2
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          queries=(
            projection_only
            filter_select
            compound_filter
            derived_projection
            grouped_aggregation
            multi_aggregation
            string_filter
            limit_pushdown
            sorted_topk
            window_aggregation
            self_join
            unique_tenant
            full_aggregation
          )
          for query in "${queries[@]}"; do
            /tmp/golars-benchmark \
              -dataset /tmp/golars-benchmark.parquet \
              -query "$query" \
              -iterations 3 \
              -warmup 1 \
              -native-backend=true \
              > "benchmark-results/${query}-go.json"
            benchmarks/polars/target/release/golars-polars-benchmark \
              --dataset /tmp/golars-benchmark.parquet \
              --query "$query" \
              --iterations 3 \
              --warmup 1 \
              > "benchmark-results/${query}-rust.json"
            case "$query" in
              # These plans intentionally use the portable Go executor today;
              # keep their known parity gaps visible without treating them as
              # regressions in the native backend.
              window_aggregation) max_ratio=16.0 ;;
              unique_tenant) max_ratio=8.0 ;;
              *) max_ratio=4.0 ;;
            esac
            python3 scripts/check_benchmark_regression.py \
              --go "benchmark-results/${query}-go.json" \
              --rust "benchmark-results/${query}-rust.json" \
              --max-ratio "$max_ratio"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmark-results
